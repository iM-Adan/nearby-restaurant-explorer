<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Nearby Restaurant Explorer user demo</title>
  <desc id="desc">Three-step animated walkthrough: choose a search, explore nearby results and performance, then add a restaurant.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081525"/>
      <stop offset="1" stop-color="#122b43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="map-grid" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(-18)">
      <rect width="46" height="46" fill="#122d3b"/>
      <path d="M0 10H46M0 34H46M12 0V46M34 0V46" stroke="#1b4652" stroke-width="2"/>
      <path d="M0 22H46M23 0V46" stroke="#24534f" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7dd3fc"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .title { fill: #f8fafc; font-size: 32px; font-weight: 700; }
      .subtitle { fill: #a9c4d8; font-size: 16px; }
      .step-title { fill: #f8fafc; font-size: 20px; font-weight: 700; }
      .label { fill: #cbd5e1; font-size: 13px; }
      .small { fill: #94a3b8; font-size: 11px; }
      .value { fill: #f1f5f9; font-size: 13px; font-weight: 600; }
      .panel { fill: #101f32; stroke: #28415a; stroke-width: 1.5; }
      .control { fill: #0b1727; stroke: #31465c; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="820" rx="24" fill="url(#background)"/>
  <text x="720" y="58" text-anchor="middle" class="title">Nearby Restaurant Explorer</text>
  <text x="720" y="88" text-anchor="middle" class="subtitle">A quick tour of the real map experience: search, compare, and add places</text>

  <g transform="translate(40 126)">
    <rect width="430" height="630" rx="18" class="panel"/>
    <circle cx="34" cy="38" r="18" fill="#123d56" stroke="#38bdf8"/>
    <text x="34" y="44" text-anchor="middle" fill="#bae6fd" font-size="16" font-weight="700">1</text>
    <text x="64" y="44" class="step-title">Choose where to search</text>
    <text x="26" y="77" class="label">Set a radius and optional cuisine, then click the map.</text>

    <rect x="22" y="100" width="386" height="422" rx="12" fill="#0b1422" stroke="#31465c"/>
    <rect x="22" y="100" width="155" height="422" rx="12" fill="#16263a"/>
    <path d="M177 100V522" stroke="#31465c"/>
    <text x="40" y="132" fill="#7dd3fc" font-size="15" font-weight="700">Nearby Explorer</text>
    <text x="40" y="160" class="small">SEARCH RADIUS</text>
    <rect x="39" y="171" width="120" height="34" rx="6" class="control"/>
    <text x="52" y="193" class="value">3.0 km</text>
    <path d="M44 222H151" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <path d="M44 222H105" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <circle cx="105" cy="222" r="7" fill="#7dd3fc"/>
    <text x="40" y="257" class="small">CUISINE</text>
    <rect x="39" y="267" width="120" height="38" rx="6" class="control"/>
    <text x="50" y="291" class="value">Italian</text>
    <path d="M145 283l5 5 5-5" fill="none" stroke="#94a3b8"/>
    <rect x="39" y="326" width="120" height="43" rx="7" fill="#38bdf8"/>
    <text x="99" y="353" text-anchor="middle" fill="#082033" font-size="12" font-weight="700">Run Search</text>
    <text x="40" y="405" class="small">Tip: Click anywhere on</text>
    <text x="40" y="422" class="small">the map to move the center.</text>

    <rect x="178" y="101" width="229" height="420" rx="12" fill="url(#map-grid)"/>
    <path d="M187 190C245 155 284 213 337 180S392 162 410 177M184 335C247 300 296 348 405 303M206 450C264 408 337 453 412 415" fill="none" stroke="#39705f" stroke-width="9" opacity=".8"/>
    <path d="M250 104C265 190 242 252 277 321S262 430 285 519M365 102C350 190 377 257 348 340S379 429 359 520" fill="none" stroke="#426273" stroke-width="5" opacity=".8"/>
    <circle cx="298" cy="298" r="78" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5"/>
    <circle cx="298" cy="298" r="7" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
    <path d="M298 278C286 278 278 287 278 299c0 15 20 34 20 34s20-19 20-34c0-12-8-21-20-21zm0 28a8 8 0 1 1 0-16 8 8 0 0 1 0 16z" fill="#fb7185"/>
    <circle cx="215" cy="239" r="5" fill="#fbbf24"/>
    <circle cx="355" cy="247" r="5" fill="#fbbf24"/>
    <circle cx="339" cy="369" r="5" fill="#fbbf24"/>
    <circle cx="222" cy="388" r="5" fill="#fbbf24"/>
    <circle cx="298" cy="298" r="20" fill="none" stroke="#93c5fd" stroke-width="2">
      <animate attributeName="r" values="12;28;12" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.1;.9" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <path d="M318 276L357 238" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
    <text x="26" y="564" class="value">Map click sets the search center</text>
    <text x="26" y="589" class="label">The radius circle updates before results appear.</text>
    <rect x="26" y="606" width="378" height="5" rx="3" fill="#23374b"/>
    <rect x="26" y="606" width="126" height="5" rx="3" fill="#38bdf8"/>
  </g>

  <g transform="translate(505 126)">
    <rect width="430" height="630" rx="18" class="panel"/>
    <circle cx="34" cy="38" r="18" fill="#123d56" stroke="#38bdf8"/>
    <text x="34" y="44" text-anchor="middle" fill="#bae6fd" font-size="16" font-weight="700">2</text>
    <text x="64" y="44" class="step-title">Explore the matches</text>
    <text x="26" y="77" class="label">Compare mapped restaurants and live query metrics.</text>

    <rect x="22" y="100" width="386" height="422" rx="12" fill="#0b1422" stroke="#31465c"/>
    <rect x="22" y="100" width="167" height="422" rx="12" fill="#16263a"/>
    <path d="M189 100V522" stroke="#31465c"/>
    <text x="39" y="132" fill="#7dd3fc" font-size="15" font-weight="700">Nearby Explorer</text>
    <rect x="38" y="151" width="135" height="48" rx="7" fill="#0b1727" stroke="#245c4b"/>
    <text x="49" y="170" class="small">SOURCE TIER</text>
    <text x="49" y="189" fill="#4ade80" font-size="13" font-weight="700">L1_MEMORY</text>
    <text x="39" y="224" class="small">EXECUTION TIME</text>
    <text x="166" y="224" text-anchor="end" class="value">0.04 ms</text>
    <text x="39" y="250" class="small">TREE NODES VISITED</text>
    <text x="166" y="250" text-anchor="end" class="value">133 / 10,000</text>
    <text x="39" y="276" class="small">MATCHES RETURNED</text>
    <text x="166" y="276" text-anchor="end" class="value">3</text>
    <path d="M38 294H173" stroke="#31465c"/>
    <text x="39" y="319" fill="#e2e8f0" font-size="12" font-weight="700">Matching Restaurants</text>
    <rect x="38" y="331" width="135" height="48" rx="6" fill="#0b1727"/>
    <circle cx="51" cy="347" r="4" fill="#4ade80"/>
    <text x="62" y="350" class="value">Olive Bistro</text>
    <text x="48" y="369" class="small">Italian · 1.1 km</text>
    <rect x="38" y="386" width="135" height="48" rx="6" fill="#0b1727"/>
    <circle cx="51" cy="402" r="4" fill="#4ade80"/>
    <text x="62" y="405" class="value">Pasta Verde</text>
    <text x="48" y="424" class="small">Italian · 1.8 km</text>
    <rect x="38" y="441" width="135" height="48" rx="6" fill="#0b1727"/>
    <circle cx="51" cy="457" r="4" fill="#4ade80"/>
    <text x="62" y="460" class="value">Roma Kitchen</text>
    <text x="48" y="479" class="small">Italian · 2.4 km</text>

    <rect x="190" y="101" width="217" height="420" rx="12" fill="url(#map-grid)"/>
    <path d="M195 188C247 155 284 207 340 177S387 163 410 177M191 335C247 300 301 348 407 303M206 450C264 408 337 453 412 415" fill="none" stroke="#39705f" stroke-width="9" opacity=".8"/>
    <path d="M255 104C270 190 246 252 281 321S266 430 289 519M365 102C350 190 377 257 348 340S379 429 359 520" fill="none" stroke="#426273" stroke-width="5" opacity=".8"/>
    <circle cx="302" cy="298" r="78" fill="#38bdf8" fill-opacity=".08" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5"/>
    <circle cx="302" cy="298" r="6" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
    <g fill="#4ade80" stroke="#082033" stroke-width="2">
      <circle cx="253" cy="259" r="7"/><circle cx="347" cy="260" r="7"/><circle cx="334" cy="353" r="7"/>
    </g>
    <g fill="#0b1727" stroke="#4ade80">
      <rect x="217" y="226" width="76" height="23" rx="6"/>
      <rect x="312" y="228" width="80" height="23" rx="6"/>
      <rect x="294" y="364" width="95" height="23" rx="6"/>
    </g>
    <g fill="#d1fae5" font-size="9" font-weight="600">
      <text x="255" y="241" text-anchor="middle">Olive Bistro</text>
      <text x="352" y="243" text-anchor="middle">Pasta Verde</text>
      <text x="341" y="379" text-anchor="middle">Roma Kitchen</text>
    </g>
    <rect x="26" y="564" width="378" height="5" rx="3" fill="#23374b"/>
    <rect x="26" y="564" width="252" height="5" rx="3" fill="#38bdf8"/>
    <text x="26" y="597" class="value">See what the query actually did</text>
    <text x="26" y="620" class="label">Result pins, distances, cache tier, latency, and tree work.</text>
  </g>

  <g transform="translate(970 126)">
    <rect width="430" height="630" rx="18" class="panel"/>
    <circle cx="34" cy="38" r="18" fill="#123d56" stroke="#34d399"/>
    <text x="34" y="44" text-anchor="middle" fill="#a7f3d0" font-size="16" font-weight="700">3</text>
    <text x="64" y="44" class="step-title">Add a restaurant</text>
    <text x="26" y="77" class="label">Publish a new spot at the current map center.</text>

    <rect x="22" y="100" width="386" height="422" rx="12" fill="#0b1422" stroke="#31465c"/>
    <text x="44" y="138" fill="#7dd3fc" font-size="15" font-weight="700">Async Kafka Ingestion</text>
    <text x="44" y="164" class="label">Live add at map center</text>
    <text x="44" y="202" class="small">RESTAURANT NAME</text>
    <rect x="43" y="212" width="344" height="44" rx="7" class="control"/>
    <text x="58" y="239" class="value">Aero Cyber Cafe</text>
    <text x="44" y="284" class="small">LOCATION</text>
    <rect x="43" y="294" width="344" height="44" rx="7" class="control"/>
    <text x="58" y="321" class="value">28.5458, 77.1928</text>
    <rect x="43" y="359" width="344" height="48" rx="8" fill="#34d399"/>
    <text x="215" y="389" text-anchor="middle" fill="#06291f" font-size="13" font-weight="700">Publish to Kafka &amp; Invalidate Cache</text>
    <rect x="43" y="425" width="344" height="67" rx="8" fill="#0b261f" stroke="#23664e"/>
    <circle cx="64" cy="458" r="10" fill="#34d399"/>
    <path d="M59 458l4 4 7-9" fill="none" stroke="#052e22" stroke-width="2.5"/>
    <text x="84" y="453" fill="#a7f3d0" font-size="12" font-weight="700">Accepted for asynchronous processing</text>
    <text x="84" y="474" class="small">Database, live tree, and caches are updated.</text>

    <path d="M62 567H367" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <circle r="6" fill="#34d399" filter="url(#glow)">
      <animateMotion dur="3s" repeatCount="indefinite" path="M62 567H367"/>
    </circle>
    <text x="26" y="597" class="value">New data flows in without blocking the UI</text>
    <text x="26" y="620" class="label">Kafka consumer persists it, updates the index, clears stale cache.</text>
  </g>

  <text x="720" y="791" text-anchor="middle" fill="#7892a8" font-size="12">Illustrated UI walkthrough · Search directly on the live map at localhost</text>
</svg>
